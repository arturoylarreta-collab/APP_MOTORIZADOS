# Compila el APK de la app en GitHub cada vez que cambia el código.
# No hace falta tener Flutter instalado en ninguna PC.
#
# Resultado: en la pestaña "Actions" del repo, cada corrida deja el APK como
# artefacto y, si la compilación fue en la rama main, también crea un Release
# "build-N" con el APK adjunto (Releases → el más reciente → Assets).
#
# Firma:
#   - Si el repo tiene los secretos ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#     KEY_ALIAS y KEY_PASSWORD, el APK se firma con la llave de la empresa
#     (y las versiones siguientes se instalan encima sin desinstalar).
#   - Si no, se firma con una llave de depuración generada en el momento:
#     sirve para instalar y probar, pero cada versión nueva exige desinstalar
#     la anterior. (Los secretos los crea el administrador del repo.)
name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Java 21 (requerido por Android Gradle Plugin 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Flutter (canal estable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: |
          flutter --version
          java -version

      - name: Dependencias
        run: flutter pub get

      - name: Llave de firma (empresa si hay secretos; si no, depuración)
        id: firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/vendu-release.jks
            cat > android/key.properties <<EOF
          storeFile=vendu-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "modo=empresa" >> "$GITHUB_OUTPUT"
            echo "Firma: llave de la empresa"
          else
            echo "modo=debug" >> "$GITHUB_OUTPUT"
            echo "Firma: llave de depuracion (sin secretos en el repo)"
          fi

      - name: Compilar APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          ls -la build/app/outputs/flutter-apk/

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp build/app/outputs/flutter-apk/app-release.apk \
             "salida/vendu-motorizados-1.0.${{ github.run_number }}-${{ steps.firma.outputs.modo }}.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vendu-motorizados-apk
          path: salida/*.apk
          retention-days: 90

      - name: Publicar Release (solo rama main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" salida/*.apk \
            --title "App Motorizados 1.0.${{ github.run_number }}" \
            --notes "Compilado automaticamente desde ${{ github.sha }}. Firma: ${{ steps.firma.outputs.modo }}. Si la firma es 'debug', hay que desinstalar la version anterior antes de instalar." \
            --latest
